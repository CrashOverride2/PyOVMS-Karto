[pytest]
asyncio_mode = auto
testpaths = tests
# -m "not cve" keeps the default run offline and deterministic. A command-line -m
# overrides this one (addopts are prepended), so `pytest -m cve` runs exactly the
# deselected tests. See tests/test_dependency_cves.py.
addopts = -q -m "not cve"
markers =
    cve: queries the online advisory database; deselected by default, run with `pytest -m cve`
# log_cli was on at DEBUG, which buried the result summary under application logs.
# Re-enable per run when debugging: pytest -o log_cli=true -o log_cli_level=DEBUG
